name = "icn-gate-proxy"
main = "worker.js"
compatibility_date = "2026-08-03"

# 배포 후 Worker URL 예: https://icn-gate-proxy.<your-subdomain>.workers.dev
#
# serviceKey 는 코드/repo 에 두지 말고 secret 으로 넣습니다:
#   cd proxy
#   npx wrangler secret put SERVICE_KEY
#   (프롬프트가 뜨면 공공데이터포털 "인코딩 인증키" 붙여넣기)
#
# 로컬 테스트:  npx wrangler dev
# 배포:         npx wrangler deploy


# ── L2 캐시용 KV (선택) ────────────────────────────────────────────────────
#
# 없어도 Worker 는 그대로 동작합니다(메모리 캐시만 사용). 붙이면 isolate/콜로
# 사이에서도 캐시가 공유되어 data.go.kr 호출이 더 줄어듭니다.
#
# 1) 네임스페이스 생성 — 출력에 나오는 id 를 아래 id 자리에 붙여넣으세요:
#      npx wrangler kv namespace create GATE_CACHE
# 2) 아래 [[kv_namespaces]] 블록에 id 를 채웁니다. (2026-08-28 설정 완료)
# 3) npx wrangler deploy
#
# 무료 한도: 읽기 100,000/일, 쓰기 1,000/일(하드 캡). 쓰기는 캐시 미스에서만
# 발생하고, 한도를 넘겨 실패해도 사용자 응답에는 영향이 없도록 처리돼 있습니다.
#
[[kv_namespaces]]
binding = "GATE_CACHE"
id = "a1d7a952e7b24d43aa2fc1ee3facea46"
